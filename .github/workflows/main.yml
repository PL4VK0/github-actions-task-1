name: CI Node.js Project
on: [push, pull_request]
jobs:
  test-application-job:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "16"
      - name: download-dependencies
        run: npm i

      - name: build-project
        run: npm run build

      - name: run tests
        run: npm run test
